name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      # One import is meant to be enough for a program that only opens a socket, and nothing of
      # the adapters should be linked for it. The link line is where that is visible.
      - name: the front door links no adapter
        if: runner.os == 'Linux'
        run: |
          moon build src/examples/03-front-door --target native
          rsp="$(find _build/native/debug/build/examples/03-front-door -name '*.rsp')"
          echo "link line: $rsp"
          for bad in adapt moonhttp; do
            if grep -aq "$bad" "$rsp"; then
              echo "::error::the front door links $bad"
              exit 1
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

  tls:
    name: TLS interop and conformance
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: build the peer
        run: |
          moon update
          moon build --target native

      - name: OpenSSL interop
        run: bash scripts/tls_interop.sh

      # Pinned so a change upstream cannot turn this red without a change here.
      - name: tlsfuzzer
        env:
          TLSFUZZER_COMMIT: 5eebc4464e5197a7f7392fb9acda99cfc32441f7
          TLSLITE_COMMIT: 7e95ea1a86c0d42d8d931ff14134d31f01ce1d76
        run: |
          git clone --quiet --filter=blob:none https://github.com/tlsfuzzer/tlsfuzzer _tlsfuzzer
          git -C _tlsfuzzer checkout --quiet "$TLSFUZZER_COMMIT"
          python3 -m venv _venv
          _venv/bin/pip install --quiet "tlslite-ng @ git+https://github.com/tlsfuzzer/tlslite-ng@$TLSLITE_COMMIT" ecdsa
          TLSFUZZER=_tlsfuzzer PYTHON=_venv/bin/python bash scripts/tls_fuzz.sh

  interop:
    name: Real traffic through every adapter
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # HTTP/1.1, HTTP/2, HTTP/3 and WebSocket against nginx in a container and against a
      # server built on mooncat, over real sockets. Docker is on the runner already.
      - name: real traffic
        run: |
          moon update
          bash scripts/http_interop.sh

  websocket:
    name: WebSocket conformance
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # The suite is Autobahn's, in a container; the client under test is this repository's, and
      # the verdict is the server's report.
      - name: autobahn
        run: |
          moon update
          bash scripts/ws_conformance.sh
